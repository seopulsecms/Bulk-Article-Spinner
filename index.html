    <style>
        :root {
            --bg: #0a0e17;
            --bg-secondary: #111827;
            --card: #151d2e;
            --card-hover: #1a2438;
            --border: #1e2d45;
            --border-focus: #00e5a0;
            --fg: #e8edf5;
            --fg-muted: #7a8ba8;
            --accent: #00e5a0;
            --accent-dim: rgba(0, 229, 160, 0.12);
            --accent-glow: rgba(0, 229, 160, 0.25);
            --danger: #ff4d6a;
            --danger-dim: rgba(255, 77, 106, 0.12);
            --warning: #ffb84d;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === Background Atmosphere === */
        .bg-atmosphere {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-atmosphere .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .bg-atmosphere .orb:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-glow), transparent 70%);
            top: -10%; left: -5%;
            animation-duration: 25s;
        }

        .bg-atmosphere .orb:nth-child(2) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent 70%);
            bottom: -15%; right: -10%;
            animation-duration: 30s;
            animation-delay: -8s;
        }

        .bg-atmosphere .orb:nth-child(3) {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(0, 229, 160, 0.08), transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 22s;
            animation-delay: -4s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(30px, 40px) scale(1.02); }
        }

        /* === Grid Pattern Overlay === */
        .grid-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(30, 45, 69, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 45, 69, 0.3) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 20%, transparent 70%);
        }

        /* === Layout === */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* === Header === */
        header {
            text-align: center;
            padding: 48px 0 36px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px; height: 64px;
            background: var(--accent-dim);
            border: 1px solid rgba(0, 229, 160, 0.2);
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 28px;
            color: var(--accent);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
            50% { box-shadow: 0 0 30px 5px var(--accent-glow); }
        }

        header h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--fg-muted);
            font-size: 16px;
            font-weight: 300;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* === Cards === */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 20px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            border-color: rgba(0, 229, 160, 0.15);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--fg-muted);
            margin-bottom: 18px;
        }

        .card-title i {
            color: var(--accent);
            font-size: 16px;
        }

        /* === Textarea === */
        .spintax-input {
            width: 100%;
            min-height: 260px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px;
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .spintax-input::placeholder {
            color: var(--fg-muted);
            opacity: 0.5;
        }

        .spintax-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-dim), 0 0 20px -5px var(--accent-glow);
        }

        /* === Number Input === */
        .count-row {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
        }

        .count-field {
            flex: 1;
            min-width: 180px;
        }

        .count-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--fg-muted);
            margin-bottom: 8px;
        }

        .count-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            -moz-appearance: textfield;
        }

        .count-input::-webkit-outer-spin-button,
        .count-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .count-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        /* === Filename Input === */
        .filename-field {
            flex: 1;
            min-width: 180px;
        }

        .filename-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--fg-muted);
            margin-bottom: 8px;
        }

        .filename-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .filename-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        /* === Buttons === */
        .btn-generate {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 32px;
            background: linear-gradient(135deg, #00e5a0, #00c9a7);
            color: #0a0e17;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, opacity 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-generate:hover::before {
            transform: translateX(100%);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -5px var(--accent-glow), 0 0 40px -10px var(--accent);
        }

        .btn-generate:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-generate:disabled::before {
            display: none;
        }

        /* === Stats Bar === */
        .stats-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--accent-dim);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
        }

        .stat-chip.warn {
            background: var(--danger-dim);
            color: var(--danger);
        }

        /* === Preview Section === */
        .preview-section {
            margin-top: 24px;
        }

        .preview-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--fg-muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .preview-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .preview-toggle i {
            transition: transform 0.3s;
        }

        .preview-toggle.open i {
            transform: rotate(180deg);
        }

        .preview-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.3s;
            opacity: 0;
        }

        .preview-list.open {
            max-height: 2000px;
            opacity: 1;
            margin-top: 16px;
        }

        .preview-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--fg);
            max-height: 180px;
            overflow-y: auto;
            word-break: break-word;
        }

        .preview-item-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        /* === Toast === */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            font-size: 14px;
            font-weight: 500;
            color: var(--fg);
            pointer-events: auto;
            animation: toastIn 0.4s ease forwards;
            max-width: 400px;
        }

        .toast.success { border-left: 3px solid var(--accent); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--warning); }

        .toast i.fa-circle-check { color: var(--accent); }
        .toast i.fa-circle-xmark { color: var(--danger); }
        .toast i.fa-circle-info { color: var(--warning); }

        .toast.removing {
            animation: toastOut 0.3s ease forwards;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateX(0) scale(1); }
            to { opacity: 0; transform: translateX(40px) scale(0.9); }
        }

        /* === Spintax Help === */
        .help-section {
            margin-top: 8px;
        }

        .help-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--fg-muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .help-toggle:hover {
            color: var(--accent);
        }

        .help-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s;
            opacity: 0;
        }

        .help-content.open {
            max-height: 500px;
            opacity: 1;
            margin-top: 10px;
        }

        .help-content-inner {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            font-size: 13px;
            line-height: 1.8;
            color: var(--fg-muted);
        }

        .help-content-inner code {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 2px 7px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        /* === Loading Spinner === */
        .spinner-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: rgba(10, 14, 23, 0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .spinner-overlay.active {
            display: flex;
        }

        .spinner-ring {
            width: 56px; height: 56px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spinRing 0.8s linear infinite;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .spinner-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--fg-muted);
        }

        .spinner-progress {
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
        }

        /* === Scrollbar === */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }

        /* === Responsive === */
        @media (max-width: 640px) {
            .app-container { padding: 16px 12px 40px; }
            header { padding: 32px 0 24px; }
            .card { padding: 20px; }
            .spintax-input { min-height: 200px; font-size: 12px; padding: 14px; }
            .count-row { flex-direction: column; gap: 12px; }
            .toast-container { top: 12px; right: 12px; left: 12px; }
            .toast { max-width: 100%; }
        }

        /* === Reduced Motion === */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
